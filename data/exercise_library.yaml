exercises:
  - name: Single-leg landmine Romanian deadlift
    description: Jednonožní rumunský mrtvý tah s jedním koncem olympijské osy stabilně opřeným v rohu místnosti.
    status: Uživatelem vyzkoušený cvik
    equipment:
      - Olympijská osa Strong 2.0
      - Kotouče pro olympijskou osu
      - Stabilní a neklouzavé opření nepoužívaného konce osy
    setup: Zatížený konec osy držím jednou rukou, druhý konec je opřený v rohu místnosti.
    safety_notes:
      - Před každou sérií ověřit, že opřený konec nemůže vyklouznout ani se zvednout.
      - Nepoužívat roh nebo povrch, který neposkytuje stabilní opření.
    reference_url: https://www.youtube.com/results?search_query=single+leg+landmine+romanian+deadlift
  - name: Dumbbell seal row on elevated bench
    description: Seal row s jednoručkami na polohovatelné lavici vyvýšené pomocí velkých olympijských kotoučů.
    status: Uživatelem vyzkoušená improvizovaná sestava
    equipment:
      - Polohovatelná lavice TRINFIT Bench L5 Pro
      - Kotouče pro olympijskou osu
      - Set nakládacích jednoručních činek TRINFIT 30 mm, 2 × 30 kg
    setup: Pod opěrné body lavice naskládám velké olympijské kotouče tak, aby vznikl prostor pro spuštění jednoruček.
    safety_notes:
      - Před každým použitím ověřit stejnou výšku a stabilitu všech opěrných bodů lavice.
      - Lavice ani kotouče se nesmějí při zatížení kývat, naklánět nebo klouzat.
      - Sestavu nepoužívat, pokud opěrné body neleží celou plochou na stabilním podkladu.
    reference_url: https://www.youtube.com/results?search_query=dumbbell+seal+row
